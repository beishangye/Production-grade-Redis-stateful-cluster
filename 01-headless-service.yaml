apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  labels:
    app: redis
    tier: db
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis
    tier: db
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: cluster-bus
      port: 16379
      targetPort: 16379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-nodeport
  labels:
    app: redis
    tier: db
spec:
  type: NodePort
  selector:
    app: redis
    tier: db
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30079
